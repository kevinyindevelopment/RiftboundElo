# Scheduled, cloud-hosted data refresh for the RiftElo site.
#
# Runs on GitHub's always-on runners (NOT a personal PC), so the live site at
# kevin-yin.com/riftelo stays fresh even when every local machine is off — which
# was the whole problem: the old Windows Task Scheduler job only fired when the
# work PC happened to be on, so weekends/holidays went stale.
#
# Scope: ONLY the tracked Michigan + California stores + UVS premier events (the
# `ingest:stores` known-store path). NEVER `--global` — worldwide Riftbound is
# ~59k events/day and would run for hours. See AGENTS.md / project memory.
#
# The scripts write straight to Neon over the direct connection, so no redeploy
# is needed — the SSR site reads the new data on the next request.
name: Update ratings

on:
  schedule:
    # Every 6 hours (UTC). Unchanged events are skipped and the recompute only
    # runs when new matches actually landed, so quiet hours are cheap.
    #
    # Why 6 and not 3: Neon bills compute by AWAKE-TIME and suspends after 5
    # minutes idle, so every scheduled run costs its own duration PLUS the
    # 5-minute idle countdown. That makes the schedule a fixed cost floor
    # independent of how efficient the queries are — halving it halves the
    # floor. Local events cluster on evenings and weekends, so 6h loses very
    # little freshness. See COST.md.
    #
    # ⚠️ COST NOTE. This schedule once exhausted Neon's monthly data-transfer
    # quota in a few days, which took the live site down hard: Neon began
    # refusing EVERY query with HTTP 402, so every page 500'd. The cause was
    # recompute downloading whole tables each run (~91 MB: all Match rows with
    # each event's name inlined per row, plus the entire RatingChange table) to
    # diff them client-side.
    #
    # That is fixed — recompute now pulls ~22 MB and diffs inside Postgres via
    # ON CONFLICT ... WHERE IS DISTINCT FROM (verified: byte-identical output).
    - cron: "0 */6 * * *"
  # Allow manual runs from the Actions tab (useful for testing / on-demand).
  workflow_dispatch:
    inputs:
      store_ids:
        description: >-
          Space-separated carde store ids to ingest INSTEAD of the routine
          known-store sync. Leave blank for the normal scoped refresh.
        required: false
        type: string

# Never let two refreshes overlap (they'd contend on the same Neon writes).
concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 60 min gives the one-time historical backfill + first large recompute room;
    # steady-state runs finish in a handful of minutes, well under this.
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      CARDE_TOKEN: ${{ secrets.CARDE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`.
      - run: npm ci

      - name: Ingest new results (scoped to tracked stores + premier)
        env:
          # Via env, not `${{ }}` inline, so the value can't break out of the script.
          STORE_IDS: ${{ inputs.store_ids }}
        run: |
          BEFORE=$(npx tsx scripts/match-fingerprint.ts)
          echo "match fingerprint before: $BEFORE"
          if [ -n "$STORE_IDS" ]; then
            # Ad-hoc: pull named store(s) only.
            #
            # Why this exists: carde's location search silently omits some real
            # venues. Verified for store 64147 (Gen.G Esports x ASU LA GAME
            # School, Los Angeles) — a 10/25/50-mile search centred on its OWN
            # coordinates returns none of its events, so --discover / --ca-grid
            # can never find it, and its 128-player event was invisible to us.
            # Such a store has to be named by id once; the first ingest writes
            # the Store row, after which the routine known-store sync (which
            # reads the Store table) picks the venue up on its own forever.
            case "$STORE_IDS" in
              "" | *[!0-9\ ]*)
                echo "store_ids must be space-separated numbers; got: $STORE_IDS"
                exit 1
                ;;
            esac
            echo "Targeted ingest of store(s): $STORE_IDS"
            # Unquoted on purpose: --store takes several ids as separate args.
            npm run ingest:stores -- --store $STORE_IDS
          else
            npm run ingest:stores
            npm run ingest:stores -- --premier
          fi
          AFTER=$(npx tsx scripts/match-fingerprint.ts)
          echo "match fingerprint after:  $AFTER"
          echo "FP_BEFORE=$BEFORE" >> "$GITHUB_ENV"
          echo "FP_AFTER=$AFTER" >> "$GITHUB_ENV"

      - name: Recompute ratings (only if match results changed)
        run: |
          if [ "$FP_BEFORE" != "$FP_AFTER" ]; then
            echo "Match results changed ($FP_BEFORE -> $FP_AFTER) — recomputing."
            npm run elo:recompute
          else
            echo "No match-result changes — skipping recompute."
          fi
